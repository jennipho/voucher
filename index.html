<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Voucher</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
  .logo { display: block; width: 220px; max-width: 70vw; margin: 0 auto 32px; }
  p { margin: 0 0 12px; font-size: 18px; color: #555; }
  #code { font-size: 28px; font-weight: 700; letter-spacing: 1px; word-break: break-all; }
</style>
</head>
<body>
  <div>
    <img class="logo" src="logo.jpeg" alt="HaruFilm">
    <p>Your voucher code is:</p>
    <div id="code"></div>
  </div>
  <script>
    var code = new URLSearchParams(location.search).get("code");
    document.getElementById("code").textContent = code || "No code found";
  </script>
</body>
</html>
